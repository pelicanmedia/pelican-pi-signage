<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — Pi Signage</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white rounded-xl shadow p-8 w-full max-w-sm">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-xl font-bold text-gray-800">Change password</h1>
      <a href="/admin" class="text-sm text-indigo-600 hover:underline">&larr; Back</a>
    </div>

    {% if error %}
    <p class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2 mb-4">
      {{ error }}
    </p>
    {% endif %}
    {% if message %}
    <p class="text-sm text-green-700 bg-green-50 border border-green-200 rounded-lg px-3 py-2 mb-4">
      {{ message }}
    </p>
    {% endif %}

    <form method="POST" class="space-y-4">
      <div>
        <label for="current" class="text-sm font-medium text-gray-700">Current password</label>
        <input id="current" type="password" name="current" required autocomplete="current-password"
               class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
      <div>
        <label for="password" class="text-sm font-medium text-gray-700">New password</label>
        <input id="password" type="password" name="password" required
               minlength="{{ min_length }}" autocomplete="new-password"
               class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <p class="text-xs text-gray-400 mt-1">At least {{ min_length }} characters.</p>
      </div>
      <div>
        <label for="confirm" class="text-sm font-medium text-gray-700">Confirm new password</label>
        <input id="confirm" type="password" name="confirm" required
               minlength="{{ min_length }}" autocomplete="new-password"
               class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2
                     rounded-lg transition text-sm">
        Update password
      </button>
    </form>
  </div>
</body>
</html>
