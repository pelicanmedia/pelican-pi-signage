<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Message</title>
  <!--
    Built-in text slide. Query parameters (all optional):
      title  heading
      body   message text (new lines are kept)
      align  center (default) or left
      bg/fg  background / text colour as hex without #, e.g. 1e3a8a / ffffff
    Text is shrunk automatically so it always fits the screen.
  -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: var(--bg, #000); color: var(--fg, #fff);
    }
    #box { width: 86vw; text-align: center; overflow-wrap: break-word; }
    #box.left { text-align: left; }
    #title { font-weight: 700; line-height: 1.1; margin: 0 0 .4em; font-size: 1.6em; }
    #body  { white-space: pre-line; line-height: 1.3; margin: 0; opacity: .9; }
  </style>
</head>
<body>
  <div id="box">
    <h1 id="title"></h1>
    <p id="body"></p>
  </div>

  <script>
    const q = new URLSearchParams(location.search);
    const color = v => /^[0-9a-f]{3,8}$/i.test(v || "") ? "#" + v : null;
    if (color(q.get("bg"))) document.body.style.setProperty("--bg", color(q.get("bg")));
    if (color(q.get("fg"))) document.body.style.setProperty("--fg", color(q.get("fg")));

    const box   = document.getElementById("box");
    const title = document.getElementById("title");
    const body  = document.getElementById("body");
    title.textContent = q.get("title") || "";
    body.textContent  = q.get("body") || "";
    if (!title.textContent) title.hidden = true;
    if (!body.textContent) body.hidden = true;
    if (q.get("align") === "left") box.classList.add("left");

    // Largest font size (in vmin) at which the text still fits
    function fit() {
      let lo = 1, hi = 14;
      for (let i = 0; i < 12; i++) {
        const mid = (lo + hi) / 2;
        box.style.fontSize = mid + "vmin";
        const fits = box.offsetHeight <= innerHeight * 0.86 && box.scrollWidth <= box.clientWidth + 1;
        if (fits) lo = mid; else hi = mid;
      }
      box.style.fontSize = lo + "vmin";
    }
    fit();
    addEventListener("resize", fit);
    if (document.fonts) document.fonts.ready.then(fit);
  </script>
</body>
</html>
